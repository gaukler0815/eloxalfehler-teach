# Deploys the Eloxal Rebels game to GitHub Pages so it can be played from any
# browser (desktop, tablet, phone) at:
#   https://gaukler0815.github.io/eloxalfehler-teach/
#
# Publishes the eloxal-rebels/ folder to a gh-pages branch; GitHub serves that
# branch as the Pages site automatically. (The artifact-based deploy needs the
# Pages site pre-created, which the workflow token is not allowed to do — the
# branch route needs no manual setup at all.)
# Runs on every push to main that touches the game, or manually via the
# Actions tab ("Run workflow").
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'eloxal-rebels/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run game tests
        run: |
          node eloxal-rebels/tests/conductivity.test.js
          node eloxal-rebels/tests/sim.test.js

      - name: Publish eloxal-rebels/ to the gh-pages branch
        run: |
          cd eloxal-rebels
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy game from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

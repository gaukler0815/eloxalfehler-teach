# Deploys the games to GitHub Pages so they can be played from any browser
# (desktop, tablet, phone):
#   Eloxal Rebels: https://gaukler0815.github.io/eloxalfehler-teach/
#   Eloxal Kart:   https://gaukler0815.github.io/eloxalfehler-teach/kart/
#     (Pages is static hosting, so the kart game runs in solo mode there;
#      online multiplayer needs the Node server, see eloxal-kart/README.md.)
#
# Publishes a combined site folder to a gh-pages branch; GitHub serves that
# branch as the Pages site automatically. (The artifact-based deploy needs the
# Pages site pre-created, which the workflow token is not allowed to do — the
# branch route needs no manual setup at all.)
# Runs on every push to main that touches a game, or manually via the
# Actions tab ("Run workflow").
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'eloxal-rebels/**'
      - 'eloxal-kart/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Eloxal Rebels tests
        run: |
          for f in eloxal-rebels/tests/*.test.js; do node "$f"; done

      - name: Run Eloxal Kart tests
        run: |
          cd eloxal-kart
          node --test tests/*.test.js

      - name: Assemble site (rebels at /, kart at /kart/)
        run: |
          mkdir -p _site
          cp -r eloxal-rebels/. _site/
          mkdir -p _site/kart
          cp -r eloxal-kart/public/. _site/kart/
          touch _site/.nojekyll

      - name: Publish to the gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy games from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

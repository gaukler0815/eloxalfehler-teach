<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eloxal Kart – Canyon-Kurs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🏎️%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ui-font: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    --accent: #F5A81C;        /* Jacobi gold */
    --brand-blue: #1E74DC;
    --brand-blue-light: #8FD3FF;
    --panel: rgba(23, 19, 31, 0.90);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #10182a; font-family: var(--ui-font); }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(30, 116, 220, 0.35), transparent 60%),
      linear-gradient(170deg, #241D33 0%, #332A47 55%, #140F1C 100%);
    z-index: 20;
  }
  .overlay.hidden, .hidden { display: none !important; }
  .panel {
    background: var(--panel); color: #fff; border-radius: 18px; padding: 28px 34px;
    box-shadow: 0 18px 60px rgba(0,0,0,.45); max-width: 640px; width: min(92vw, 640px);
    border: 3px solid rgba(255,255,255,.15);
    max-height: 94vh; max-height: 94dvh; overflow-y: auto; /* small landscape phones */
  }
  @media (max-height: 500px) {
    .panel { padding: 14px 22px; }
    .panel h1 { font-size: 30px; }
    .panel .brand svg { width: 170px; height: 42px; }
    .char .swatch { width: 24px; height: 24px; }
  }
  .panel .brand { margin-bottom: 10px; }
  .panel h1 {
    font-size: 44px; letter-spacing: 2px; margin-bottom: 2px; color: var(--accent);
    text-shadow: 3px 3px 0 #1E74DC, -1px -1px 0 #17131F;
    transform: rotate(-1.5deg);
  }
  .panel .sub { color: #C9D2DC; margin-bottom: 18px; font-size: 15px; }
  .panel label { display: block; font-size: 13px; color: #8FD3FF; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1px; }
  .panel input[type=text] {
    width: 100%; padding: 10px 12px; font-size: 18px; border-radius: 10px; border: 2px solid #3a4d6e;
    background: #17131F; color: #fff; font-family: inherit;
  }
  .chars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
  .char {
    border: 3px solid transparent; border-radius: 12px; padding: 8px 4px; text-align: center;
    background: #2b2340; cursor: pointer; transition: transform .08s;
  }
  .char:hover { transform: scale(1.05); }
  .char.sel { border-color: var(--accent); background: #1E74DC44; }
  .char .swatch { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px; border: 3px solid #fff3; }
  .char .cname { font-size: 12px; }
  .buttons { display: flex; gap: 12px; margin-top: 22px; }
  button.big {
    flex: 1; padding: 14px 10px; font-size: 18px; font-weight: bold; border: 0; border-radius: 12px;
    cursor: pointer; font-family: inherit; color: #17131F; background: var(--accent);
    box-shadow: 0 4px 0 #8a5c00; transition: transform .06s;
  }
  button.big:active { transform: translateY(3px); box-shadow: none; }
  button.big.alt { background: linear-gradient(135deg, #1E74DC, #8FD3FF); color: #fff; box-shadow: 0 4px 0 #0d3a75; }
  button.big:disabled { background: #5a6478; box-shadow: none; color: #99a; cursor: default; }
  .netstatus { margin-top: 12px; font-size: 13px; color: #ffd9a0; min-height: 18px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff; }
  .hud-box { position: absolute; background: var(--panel); border-radius: 12px; padding: 8px 14px; border: 2px solid rgba(255,255,255,.14); }
  #hud-rank { top: 14px; left: 14px; font-size: 34px; font-weight: bold; }
  #hud-rank small { font-size: 16px; color: #9fb6d8; }
  #hud-lap { top: 14px; left: 130px; font-size: 20px; padding-top: 14px; }
  #hud-time { top: 14px; left: 258px; font-size: 20px; padding-top: 14px; font-variant-numeric: tabular-nums; }
  #hud-item {
    top: 14px; right: 14px; width: 74px; height: 74px; font-size: 42px; display: flex;
    align-items: center; justify-content: center; border-radius: 50%;
    border: 4px solid var(--accent);
  }
  #hud-speed { bottom: 16px; right: 14px; font-size: 26px; font-variant-numeric: tabular-nums; }
  #hud-speed small { font-size: 13px; color: #9fb6d8; }
  #minimap { position: absolute; bottom: 16px; left: 14px; width: 170px; height: 170px; opacity: .92; }
  #hud-center {
    position: absolute; top: 26%; width: 100%; text-align: center; font-size: 110px; font-weight: bold;
    color: var(--accent); text-shadow: 4px 4px 0 #1E74DC, 0 0 40px rgba(0,0,0,.4);
  }
  #hud-msg {
    position: absolute; top: 15%; width: 100%; text-align: center; font-size: 26px; font-weight: bold;
    color: #fff; text-shadow: 2px 2px 6px #000;
  }
  #hud-wrongway {
    position: absolute; top: 38%; width: 100%; text-align: center; font-size: 40px; font-weight: bold;
    color: #ff5544; text-shadow: 2px 2px 0 #400;
  }

  /* ---------- results ---------- */
  #results { z-index: 15; background: rgba(8, 12, 24, 0.7); }
  #results table { width: 100%; border-collapse: collapse; font-size: 18px; }
  #results td, #results th { padding: 7px 10px; text-align: left; }
  #results tr.me { color: var(--accent); font-weight: bold; }
  #results tr + tr td { border-top: 1px solid #ffffff22; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 12; display: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; width: 74px; height: 74px; border-radius: 50%; pointer-events: auto;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.4); color: #fff;
    font-size: 26px; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #t-left { left: 18px; bottom: 96px; }
  #t-right { left: 116px; bottom: 96px; }
  #t-gas { right: 18px; bottom: 150px; background: rgba(126, 211, 33, .35); }
  #t-drift { right: 108px; bottom: 60px; }
  #t-item { right: 18px; bottom: 40px; background: rgba(255, 210, 62, .35); }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<!-- Hauptmenü -->
<div id="menu" class="overlay">
  <div class="panel">
    <div class="brand"></div>
    <h1>ELOXAL KART</h1>
    <div class="sub">Der Werks-Funracer der Jacobi Eloxal GmbH &middot; Canyon-Kurs &middot; 3 Runden &middot; Driften, Items, Abschießen</div>
    <label for="name">Dein Name</label>
    <input type="text" id="name" maxlength="16" placeholder="Fahrername">
    <label>Fahrer wählen</label>
    <div class="chars" id="chars"></div>
    <div class="buttons">
      <button class="big alt" id="btn-solo">Solo gegen Bots</button>
      <button class="big" id="btn-online">Online fahren</button>
    </div>
    <div class="netstatus" id="netstatus"></div>
  </div>
</div>

<!-- Lobby (online) -->
<div id="lobby" class="overlay hidden">
  <div class="panel">
    <div class="brand"></div>
    <h1 style="font-size:32px">Startaufstellung…</h1>
    <div class="sub" id="lobby-info">Warte auf Fahrer.</div>
    <ul id="lobby-list" style="list-style:none; font-size:18px; line-height:1.8"></ul>
    <div class="netstatus" id="lobby-status"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-box" id="hud-rank">–<small>/8</small></div>
  <div class="hud-box" id="hud-lap">Runde 1/3</div>
  <div class="hud-box" id="hud-time">0:00.0</div>
  <div class="hud-box" id="hud-item"></div>
  <div class="hud-box" id="hud-speed">0 <small>km/h</small></div>
  <canvas id="minimap" width="340" height="340"></canvas>
  <div id="hud-center"></div>
  <div id="hud-msg"></div>
  <div id="hud-wrongway" class="hidden">FALSCHE RICHTUNG!</div>
</div>

<!-- Touch-Steuerung -->
<div id="touch">
  <div class="tbtn" id="t-left">◀</div>
  <div class="tbtn" id="t-right">▶</div>
  <div class="tbtn" id="t-gas">▲</div>
  <div class="tbtn" id="t-drift">✦</div>
  <div class="tbtn" id="t-item">☄</div>
</div>

<!-- Ergebnis -->
<div id="results" class="overlay hidden">
  <div class="panel">
    <div class="brand"></div>
    <h1 style="font-size:34px" id="results-title">Zieleinlauf</h1>
    <table><tbody id="results-body"></tbody></table>
    <div class="buttons">
      <button class="big" id="btn-again">Nochmal!</button>
      <button class="big alt" id="btn-menu">Menü</button>
    </div>
    <div class="netstatus" id="results-status"></div>
  </div>
</div>

<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>

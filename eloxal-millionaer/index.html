<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer wird Eloxal-Millionär · Jacobi Eloxal</title>
<style>
  /* ===== Jacobi Eloxal Markenfarben ===== */
  :root{
    --alu:#C9D2DC; --blau:#1E74DC; --blau-d:#0e2a63; --gold:#F5A81C; --gold-h:#ffd166;
    --rot:#E33A2C; --gruen:#2fbf6b; --arc:#8FD3FF; --line:#17131F;
    --bg1:#050914; --bg2:#0a1834; --panel:rgba(10,24,52,.72); --text:#eef4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
    background:
      radial-gradient(1000px 620px at 50% -8%, #14357a 0%, rgba(20,53,122,0) 60%),
      radial-gradient(1400px 900px at 50% 120%, #0b1f4d 0%, rgba(11,31,77,0) 55%),
      linear-gradient(180deg,var(--bg2),var(--bg1));
    background-attachment:fixed;
  }
  /* rotierende Spotlight-Strahlen im Hintergrund (WWM-Feeling) */
  body::before{
    content:"";position:fixed;inset:-30% -30% -30% -30%;z-index:0;pointer-events:none;
    background:
      conic-gradient(from 0deg at 50% 35%,
        rgba(30,116,220,0) 0deg, rgba(30,116,220,.10) 12deg, rgba(30,116,220,0) 24deg,
        rgba(143,211,255,0) 60deg, rgba(143,211,255,.09) 72deg, rgba(143,211,255,0) 84deg,
        rgba(245,168,28,0) 160deg, rgba(245,168,28,.07) 172deg, rgba(245,168,28,0) 184deg,
        rgba(30,116,220,0) 260deg, rgba(30,116,220,.10) 272deg, rgba(30,116,220,0) 284deg);
    animation:spin 60s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .layout,header,footer{position:relative;z-index:1}

  /* ===== Kopf mit Logo ===== */
  header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px 4px;text-align:center}
  .brandlogo{width:min(300px,72vw);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  header h1{
    margin:6px 0 0;font-size:clamp(20px,4.4vw,38px);font-weight:900;letter-spacing:.6px;line-height:1.05;
    background:linear-gradient(180deg,#fff7df,var(--gold-h) 40%,var(--gold) 70%,#c77e00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 20px rgba(245,168,28,.35);
  }
  header p{margin:2px 0 0;opacity:.8;font-size:13px;letter-spacing:.5px}

  .layout{flex:1;display:grid;grid-template-columns:1fr 310px;gap:22px;
    max-width:1180px;width:100%;margin:0 auto;padding:12px 18px 26px}
  @media(max-width:880px){.layout{grid-template-columns:1fr}.ladder-wrap{order:-1}}

  /* ===== Bühne ===== */
  .stage{display:flex;flex-direction:column;gap:18px;min-height:440px;justify-content:flex-end}

  .qcard{
    position:relative;border-radius:18px;padding:24px 26px;
    background:linear-gradient(180deg,rgba(18,45,102,.96),rgba(8,24,58,.96));
    border:2px solid transparent;
    background-clip:padding-box;
    box-shadow:0 0 0 2px var(--line), 0 0 34px rgba(30,116,220,.35), 0 22px 50px rgba(0,0,0,.55);
  }
  .qcard::before{ /* Gold-Rahmenglanz */
    content:"";position:absolute;inset:-2px;border-radius:18px;z-index:-1;
    background:linear-gradient(180deg,var(--gold-h),var(--blau) 55%,var(--gold));
    filter:blur(.3px);opacity:.9;
  }
  .qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.85;margin-bottom:10px}
  .qmeta .kat{color:var(--arc);font-weight:700;letter-spacing:.4px}
  .qmeta .amt{color:var(--gold-h);font-weight:800}
  .qtext{font-size:clamp(17px,2.5vw,23px);font-weight:600;line-height:1.4;text-align:center;padding:6px 4px 4px}

  /* klassische WWM-Hexagon-Antworten */
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  @media(max-width:560px){.answers{grid-template-columns:1fr}}
  .ans{
    --c1:#0f3170; --c2:#0a1f49; --edge:var(--blau);
    position:relative;display:flex;align-items:center;gap:12px;cursor:pointer;
    padding:13px 20px;font-size:16px;color:var(--text);text-align:left;border:none;
    background:linear-gradient(180deg,var(--c1),var(--c2));
    clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);
    transition:transform .12s, filter .12s;
    outline:2px solid var(--edge);outline-offset:-2px;
  }
  .ans::after{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:2px;
    background:linear-gradient(180deg,transparent,rgba(245,168,28,.55),transparent)}
  .ans:hover:not(.locked){filter:brightness(1.12);transform:translateY(-1px)}
  .ans .letter{color:var(--gold-h);font-weight:900;min-width:20px;font-size:18px;text-shadow:0 1px 2px #000}
  .ans .txt{flex:1}
  .ans.selected{--c1:#e0a41c;--c2:#a06400;--edge:var(--gold-h);color:#221700;animation:blink .5s steps(2) 3}
  .ans.selected .letter{color:#3a2a00}
  @keyframes blink{50%{filter:brightness(1.5)}}
  .ans.correct{--c1:#22b866;--c2:#0c7a3d;--edge:#7bffb2;color:#032611;animation:winpop .5s}
  .ans.correct .letter{color:#053}
  .ans.wrong{--c1:#e6483a;--c2:#8f221a;--edge:#ff9c8f;color:#2a0600}
  @keyframes winpop{0%,100%{transform:scale(1)}45%{transform:scale(1.05)}}
  .ans.disabled{opacity:.28;pointer-events:none}
  .ans.gone{visibility:hidden}
  .ans .kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.35}

  .explain{margin-top:16px;font-size:14px;line-height:1.55;background:rgba(4,9,20,.75);
    border-left:4px solid var(--gold);padding:11px 15px;border-radius:8px;display:none;animation:fade .3s}
  .explain.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  /* ===== Joker ===== */
  .lifelines{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .ll{
    position:relative;min-width:66px;height:48px;padding:0 14px;border-radius:26px;
    border:2px solid var(--gold);color:var(--gold-h);font-weight:900;font-size:14px;cursor:pointer;
    background:radial-gradient(circle at 50% 25%,#173a86,#0a1c41);
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;
    box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .ll:hover:not(.used){box-shadow:0 0 18px var(--arc);transform:translateY(-2px)}
  .ll.used{opacity:.32;cursor:not-allowed;border-color:#556}
  .ll.used::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--rot);transform:rotate(-12deg)}

  /* ===== Geld-Leiter ===== */
  .ladder-wrap{background:var(--panel);border:1px solid rgba(143,211,255,.35);border-radius:16px;padding:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 0 30px rgba(30,116,220,.12);backdrop-filter:blur(3px);height:fit-content}
  .ladder-wrap h3{margin:2px 0 10px;text-align:center;font-size:13px;letter-spacing:2px;color:var(--arc);opacity:.9}
  .ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:3px}
  .ladder li{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-radius:9px;
    font-weight:700;font-size:14px;color:#cfe0ff;border:1px solid transparent}
  .ladder li .lvl{opacity:.5;min-width:26px;font-size:12px}
  .ladder li.safe{color:#fff;border-color:rgba(245,168,28,.25)}
  .ladder li.safe .amt{color:var(--gold-h)}
  .ladder li.won{color:var(--gruen)}
  .ladder li.won .amt{color:var(--gruen)}
  .ladder li.current{background:linear-gradient(90deg,var(--gold),var(--gold-h));color:#241a00;
    box-shadow:0 0 18px rgba(245,168,28,.6);animation:cur 1.4s ease-in-out infinite}
  .ladder li.current .lvl,.ladder li.current .amt{opacity:1;color:#241a00}
  @keyframes cur{50%{filter:brightness(1.12)}}

  /* ===== Overlays / Buttons ===== */
  .center{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
    position:relative;border-radius:18px;padding:34px 28px;
    background:linear-gradient(180deg,rgba(18,45,102,.96),rgba(8,24,58,.96));
    box-shadow:0 0 0 2px var(--line),0 0 34px rgba(30,116,220,.35),0 22px 50px rgba(0,0,0,.55)}
  .center::before{content:"";position:absolute;inset:-2px;border-radius:18px;z-index:-1;
    background:linear-gradient(180deg,var(--gold-h),var(--blau) 55%,var(--gold))}
  .btn{border:none;border-radius:40px;padding:14px 32px;font-size:17px;font-weight:900;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-h),var(--gold));color:#241a00;transition:.15s;
    box-shadow:0 6px 18px rgba(245,168,28,.4)}
  .btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .btn.ghost{background:transparent;border:2px solid var(--gold);color:var(--gold-h);box-shadow:none}
  .big{font-size:clamp(22px,4.4vw,36px);font-weight:900;
    background:linear-gradient(180deg,#fff,var(--alu) 60%,#8FA3B8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .prize{font-size:clamp(24px,5vw,40px);font-weight:900;color:var(--gold-h);text-shadow:0 2px 20px rgba(245,168,28,.5)}
  .muted{opacity:.9;font-size:15px;max-width:560px;line-height:1.55}
  .muted b{color:var(--gold-h)}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;
    background:linear-gradient(180deg,#12336f,#0a1c41);border:2px solid var(--gold);color:#fff;
    padding:12px 20px;border-radius:14px;font-size:14px;box-shadow:0 10px 34px rgba(0,0,0,.6);
    opacity:0;transition:.3s;pointer-events:none;max-width:92vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
  .toast .tt{display:block;font-size:12px;letter-spacing:1px;color:var(--gold-h);margin-bottom:3px}

  .soundbtn{position:fixed;top:14px;right:16px;z-index:60;width:46px;height:46px;border-radius:50%;
    border:2px solid var(--gold);background:radial-gradient(circle at 50% 30%,#173a86,#0a1c41);
    color:var(--gold-h);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4);transition:.15s}
  .soundbtn:hover{box-shadow:0 0 16px var(--arc);transform:translateY(-2px)}
  #confetti{position:fixed;inset:0;z-index:55;pointer-events:none;display:none}
  footer{text-align:center;font-size:12px;opacity:.55;padding:6px 0 16px}
  footer b{color:var(--gold-h)}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<button class="soundbtn" id="soundbtn" title="Ton an/aus" onclick="toggleSound()">🔊</button>
<div class="toast" id="toast"></div>

<header>
  <!-- Jacobi Eloxal Logo -->
  <svg viewBox="0 0 300 74" class="brandlogo" role="img" aria-label="Jacobi Eloxal">
    <defs>
      <linearGradient id="jxg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1E74DC"/><stop offset="1" stop-color="#8FD3FF"/>

<footer>Katalog: <b id="qcount"></b> Fragen · jede Runde neu gemischt · © Jacobi Eloxal GmbH</footer>

<script src="fragen.js"></script>
<script>
/* ============ Sound-Motor (Web Audio, ohne externe Dateien) ============ */
const Sound = (function(){
  let ctx=null, master=null;
  let an = localStorage.getItem('eloxal_sound')!=='off';
  let suspenseTimer=null, suspenseGain=null;

  function ensure(){
    if(!ctx){
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
  }
  // Einzelton mit Hüllkurve
  function ton(freq,start,dur,{type='sine',vol=0.25,glideTo=null}={}){
    if(!ctx) return;
    const t0=ctx.currentTime+start;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
  }
  function seq(noten){ noten.forEach(n=>ton(n.f,n.t,n.d,n)); }

  const api={
    isOn:()=>an,
    setOn(v){ an=v; localStorage.setItem('eloxal_sound',v?'on':'off'); if(!v) api.suspenseStop(); },
    unlock(){ if(an) ensure(); },

    select(){ if(!an)return; ensure();          // "Ist das Ihr letztes Wort?" – tiefer Impuls
      ton(150,0,0.5,{type:'sine',vol:0.35,glideTo:90});
      ton(300,0.02,0.5,{type:'triangle',vol:0.12}); },

    correct(){ if(!an)return; ensure();          // aufsteigender Dur-Akkord
      seq([{f:523,t:0,d:0.18,type:'triangle',vol:0.3},
           {f:659,t:0.12,d:0.18,type:'triangle',vol:0.3},
           {f:784,t:0.24,d:0.2,type:'triangle',vol:0.3},
           {f:1047,t:0.36,d:0.5,type:'triangle',vol:0.34}]); },

    wrong(){ if(!an)return; ensure();             // abfallender, dissonanter Buzzer
      ton(220,0,0.5,{type:'sawtooth',vol:0.28,glideTo:110});
      ton(233,0,0.5,{type:'sawtooth',vol:0.2,glideTo:98}); },

    lifeline(){ if(!an)return; ensure();          // kurzer Blip
      ton(660,0,0.12,{type:'square',vol:0.16,glideTo:990}); },

    win(){ if(!an)return; ensure();               // kleine Fanfare
      const b=0.16;
      seq([{f:523,t:0,d:b,type:'triangle',vol:0.32},{f:523,t:b,d:b,type:'triangle',vol:0.32},
           {f:523,t:2*b,d:b,type:'triangle',vol:0.32},{f:523,t:3*b,d:b*1.3,type:'triangle',vol:0.34},
           {f:415,t:4.3*b,d:b*1.3,type:'triangle',vol:0.32},{f:622,t:5.6*b,d:b*1.3,type:'triangle',vol:0.34},
           {f:523,t:6.9*b,d:b,type:'triangle',vol:0.32},{f:784,t:8*b,d:0.9,type:'triangle',vol:0.4},
           {f:1047,t:8*b,d:0.9,type:'sine',vol:0.25}]); },

    lose(){ if(!an)return; ensure();              // enttäuschter Abstieg
      seq([{f:392,t:0,d:0.25,type:'sawtooth',vol:0.26},
           {f:330,t:0.22,d:0.28,type:'sawtooth',vol:0.26},
           {f:262,t:0.48,d:0.6,type:'sawtooth',vol:0.28,glideTo:196}]); },

    // dezente Spannungs-Herzschlagschleife während der Frage
    suspenseStart(){
      if(!an) return; ensure(); api.suspenseStop();
      if(!ctx) return;
      const puls=()=>{ ton(70,0,0.35,{type:'sine',vol:0.12,glideTo:55});
                       ton(72,0.5,0.3,{type:'sine',vol:0.09,glideTo:55}); };
      puls(); suspenseTimer=setInterval(puls,1300);
    },
    suspenseStop(){ if(suspenseTimer){clearInterval(suspenseTimer);suspenseTimer=null;} }
  };
  return api;
})();
function toggleSound(){
  Sound.setOn(!Sound.isOn());
  document.getElementById('soundbtn').textContent = Sound.isOn()?'🔊':'🔇';
  if(Sound.isOn()) Sound.lifeline();
}
document.getElementById('soundbtn').textContent = Sound.isOn()?'🔊':'🔇';

/* ============ Konfiguration ============ */
const GELDLEITER=[50,100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,500000,1000000];
const SICHER=[4,9];
const SPEICHER_KEY="eloxal_millionaer_gesehen";

/* ============ Fragen-Auswahl ohne Wiederholung ============ */
function idOf(q){return q.f}
function ladeGesehen(){try{return JSON.parse(localStorage.getItem(SPEICHER_KEY))||{}}catch(e){return{}}}
function speicherGesehen(m){try{localStorage.setItem(SPEICHER_KEY,JSON.stringify(m))}catch(e){}}

function baueFragenset(){
  const gesehen=ladeGesehen(), nachStufe={1:[],2:[],3:[]};
  FRAGENKATALOG.forEach(q=>{if(nachStufe[q.s])nachStufe[q.s].push(q)});
  function ziehe(pool,anz,benutzt){
    const k=pool.filter(q=>!benutzt.has(idOf(q)));
    k.sort((a,b)=>{const ga=gesehen[idOf(a)]||0,gb=gesehen[idOf(b)]||0;return ga!==gb?ga-gb:Math.random()-.5});
    return k.slice(0,anz);
  }
  const benutzt=new Set(); let set=[];
  [1,2,3].forEach(s=>{const g=ziehe(nachStufe[s],5,benutzt);g.forEach(q=>benutzt.add(idOf(q)));set=set.concat(g)});
  if(set.length<15){const rest=FRAGENKATALOG.filter(q=>!benutzt.has(idOf(q)));rest.sort(()=>Math.random()-.5);set=set.concat(rest.slice(0,15-set.length))}
  set.forEach(q=>{gesehen[idOf(q)]=(gesehen[idOf(q)]||0)+1});
  speicherGesehen(gesehen);
  return set.map(q=>{
    const opts=q.a.map((text,i)=>({text,korrekt:i===q.r}));
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    return {frage:q.f,kategorie:q.k,erklaerung:q.e,optionen:opts,richtigerIndex:opts.findIndex(o=>o.korrekt)};
  });
}

/* ============ Zustand ============ */
let fragen=[],level=0,joker={fifty:false,publikum:false,telefon:false},entschieden=false;
const stage=document.getElementById('stage'),ladderEl=document.getElementById('ladder'),toastEl=document.getElementById('toast');
document.getElementById('qcount').textContent=FRAGENKATALOG.length;
function euro(n){return n.toLocaleString('de-DE')+" €"}
function toast(titel,msg){toastEl.innerHTML=`<span class="tt">${titel}</span>${msg}`;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),4200)}
function gesicherterBetrag(){let b=0;SICHER.forEach(i=>{if(level>i)b=GELDLEITER[i]});return b}

/* ============ Rendering ============ */
function renderLadder(){
  ladderEl.innerHTML='';
  GELDLEITER.forEach((b,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="lvl">${i+1}</span><span class="amt">${euro(b)}</span>`;
    if(SICHER.includes(i))li.classList.add('safe');
    if(i===level)li.classList.add('current');
    if(i<level)li.classList.add('won');
    ladderEl.appendChild(li);
  });
}
function renderStart(){
  renderLadder();
  stage.innerHTML=`<div class="center">
    <div class="big">Bereit für die Million? 🏆</div>
    <p class="muted">15 Fragen rund um Eloxal, Anodisation, Färben, Verdichten und typische
    Fehlerbilder. Drei Joker helfen dir, Sicherheitsstufen bei <b>500 €</b> und <b>16.000 €</b>.
    Die Fragen werden jede Runde neu aus dem Katalog gezogen – kaum eine Partie gleicht der anderen.</p>
    <button class="btn" onclick="spielStart()">▶ Spiel starten</button>
  </div>`;
}
function renderFrage(){
  entschieden=false;renderLadder();
  const q=fragen[level],betrag=GELDLEITER[level],L=['A','B','C','D'];
  stage.innerHTML=`
    <div class="lifelines">
      <button class="ll ${joker.fifty?'used':''}" id="j5050" onclick="jokerFifty()" title="50:50 – zwei falsche Antworten entfernen">50:50</button>
      <button class="ll ${joker.publikum?'used':''}" id="jpub" onclick="jokerPublikum()" title="Publikumsjoker">👥&nbsp;Publikum</button>
      <button class="ll ${joker.telefon?'used':''}" id="jtel" onclick="jokerTelefon()" title="Telefonjoker">📞&nbsp;Telefon</button>
    </div>
    <div class="qcard">
      <div class="qmeta"><span class="kat">${q.kategorie}</span><span>Frage ${level+1}/15</span><span class="amt">${euro(betrag)}</span></div>
      <div class="qtext">${q.frage}</div>
      <div class="answers" id="answers">
        ${q.optionen.map((o,i)=>`<button class="ans" data-i="${i}" onclick="waehle(${i})">
          <span class="letter">${L[i]}</span><span class="txt">${o.text}</span></button>`).join('')}
      </div>
      <div class="explain" id="explain"></div>
    </div>`;
  Sound.suspenseStart();
}

/* ============ Ablauf ============ */
function spielStart(){Sound.unlock();fragen=baueFragenset();level=0;joker={fifty:false,publikum:false,telefon:false};renderFrage()}
function waehle(i){
  if(entschieden)return;entschieden=true;
  Sound.suspenseStop();Sound.select();
  const q=fragen[level],btns=[...document.querySelectorAll('.ans')];
  btns.forEach(b=>b.classList.add('locked'));
  btns[i].classList.add('selected');
  setTimeout(()=>{
    const richtig=i===q.richtigerIndex;
    btns[i].classList.remove('selected');
    btns[q.richtigerIndex].classList.add('correct');
    if(!richtig)btns[i].classList.add('wrong');
    richtig?Sound.correct():Sound.wrong();
    const ex=document.getElementById('explain');
    ex.innerHTML=`<b>${richtig?'✅ Richtig!':'❌ Leider falsch.'}</b> ${q.erklaerung}`;
    ex.classList.add('show');
    setTimeout(()=>richtig?weiter():verloren(),richtig?1500:2800);
  },1100);
}
function weiter(){if(level===GELDLEITER.length-1){gewonnen();return}level++;renderFrage()}
function verloren(){
  Sound.suspenseStop();Sound.lose();renderLadder();
  const betrag=gesicherterBetrag(),q=fragen[level];
  stage.innerHTML=`<div class="center">
    <div class="big">💥 Schade!</div>
    <p class="muted">Richtig gewesen wäre:<br><b>${q.optionen[q.richtigerIndex].text}</b></p>
    <p class="muted">${q.erklaerung}</p>
    <div class="prize">Gesicherter Gewinn: ${euro(betrag)}</div>
    <div class="row"><button class="btn" onclick="spielStart()">🔄 Nochmal spielen</button>
    <button class="btn ghost" onclick="renderStart()">Zum Start</button></div></div>`;
}
function gewonnen(){
  Sound.suspenseStop();Sound.win();renderLadder();konfetti();
  stage.innerHTML=`<div class="center">
    <div class="big">🎉 ELOXAL‑MILLIONÄR! 🎉</div>
    <p class="muted">Alle 15 Fragen richtig – du beherrschst das Eloxieren aus dem Effeff!</p>
    <div class="prize">1.000.000 €</div>
    <div class="row"><button class="btn" onclick="spielStart()">🔄 Nochmal spielen</button>
    <button class="btn ghost" onclick="renderStart()">Zum Start</button></div></div>`;
}

/* ============ Joker ============ */
function sichtbareIndizes(q){return q.optionen.map((o,i)=>i).filter(i=>{const b=document.querySelector(`.ans[data-i="${i}"]`);return b&&!b.classList.contains('gone')})}
function jokerFifty(){
  if(joker.fifty||entschieden)return;joker.fifty=true;document.getElementById('j5050').classList.add('used');Sound.lifeline();
  const q=fragen[level];const falsche=q.optionen.map((o,i)=>i).filter(i=>i!==q.richtigerIndex);
  falsche.sort(()=>Math.random()-.5);
  falsche.slice(0,2).forEach(i=>{const b=document.querySelector(`.ans[data-i="${i}"]`);b.classList.add('disabled','gone')});
  toast('50:50','Zwei falsche Antworten wurden entfernt.');
}
function jokerPublikum(){
  if(joker.publikum||entschieden)return;joker.publikum=true;document.getElementById('jpub').classList.add('used');Sound.lifeline();
  const q=fragen[level],n=q.optionen.length,werte=new Array(n).fill(0),richtig=q.richtigerIndex;
  const sicht=sichtbareIndizes(q),treffer=55+Math.floor(Math.random()*30);
  werte[richtig]=treffer;let rest=100-treffer;const andere=sicht.filter(i=>i!==richtig);
  andere.forEach((i,idx)=>{const v=idx===andere.length-1?rest:Math.floor(Math.random()*rest*.7);werte[i]=v;rest-=v});
  const L=['A','B','C','D'];
  const bars=sicht.map(i=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
    <b style="width:16px;color:var(--gold-h)">${L[i]}</b>
    <span style="flex:1;height:12px;background:#0a1c41;border-radius:6px;overflow:hidden;display:inline-block">
      <span style="display:block;height:100%;width:${werte[i]}%;background:linear-gradient(90deg,var(--blau),var(--arc))"></span></span>
    <span style="width:38px;text-align:right">${werte[i]}%</span></div>`).join('');
  toast('👥 Publikumsjoker',`<div style="min-width:220px">${bars}</div>`);
}
function jokerTelefon(){
  if(joker.telefon||entschieden)return;joker.telefon=true;document.getElementById('jtel').classList.add('used');Sound.lifeline();
  const q=fragen[level],L=['A','B','C','D'],sicht=sichtbareIndizes(q);
  const sicher=Math.random()<.8;const tipp=sicher?q.richtigerIndex:sicht[Math.floor(Math.random()*sicht.length)];
  const p=sicher?[`Ganz klar, das ist ${L[tipp]}.`,`Da bin ich mir sicher: Antwort ${L[tipp]}.`,`Das hatten wir letzte Woche im Betrieb – ${L[tipp]}!`]
                :[`Hmm, nicht ganz sicher… ich würde ${L[tipp]} sagen.`,`Schwierig. Vielleicht ${L[tipp]}? Ohne Gewähr.`];
  toast('📞 Fachkollege',p[Math.floor(Math.random()*p.length)]);
}

/* ============ Konfetti ============ */
function konfetti(){
  const c=document.getElementById('confetti'),ctx=c.getContext('2d');
  c.style.display='block';c.width=innerWidth;c.height=innerHeight;
  const cols=['#F5A81C','#1E74DC','#8FD3FF','#C9D2DC','#ffd166','#2fbf6b'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,
    r:4+Math.random()*6,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,
    col:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6.28,vr:-.2+Math.random()*.4}));
  let t=0;
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});
    t++;if(t<300)requestAnimationFrame(loop);else c.style.display='none';
  })();
}
addEventListener('resize',()=>{const c=document.getElementById('confetti');if(c.style.display==='block'){c.width=innerWidth;c.height=innerHeight}});

/* Tastatur A/B/C/D + 1-4 */
addEventListener('keydown',e=>{
  const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};const k=e.key.toLowerCase();
  if(k in m){const b=document.querySelector(`.ans[data-i="${m[k]}"]`);if(b&&!b.classList.contains('disabled')&&!entschieden)waehle(m[k]);}
});

renderStart();
</script>
